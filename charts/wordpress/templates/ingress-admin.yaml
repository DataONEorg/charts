{{- if .Values.adminIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wparctic.wordpressName" . }}-admin
  labels:
    {{- include "wparctic.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace -}}
            -{{ .Release.Name }}-middleware-chain-admin@kubernetescrd"
    {{- toYaml .Values.adminIngress.annotations | nindent 4 }}
    ## Not actually used by this chart, but REQUIRED when multiple ingress definitions are
    ## co-deployed with metacat, otherwise Traefik reverts to no client certificate validation,
    ## breaking mutual TLS (mTLS) for metacat.
    ## See https://doc.traefik.io/traefik/v2.11/https/tls/#conflicting-tls-options
    ## Harmless if mTLS is not used, since TLSOption clientAuthType is 'VerifyClientCertIfGiven'
    ## (so ignores if no cert)
    traefik.ingress.kubernetes.io/router.tls.options: "{{ .Release.Namespace -}}
        -{{ required "ingress.metacatMtlsPolicyName MUST BE OVERRIDDEN" .Values.ingress.metacatMtlsPolicyName }}@kubernetescrd"
spec:
  ingressClassName: {{ .Values.adminIngress.className }}
  rules:
    # Admin host: send everything to RW (admin + preview).
    - host: {{ .Values.adminIngress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "wparctic.wordpressName" . }}-rw
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.adminIngress.host }}
      secretName: {{ .Values.adminIngress.tlsSecretName }}
{{- end }}
