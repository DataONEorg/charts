{{- define "wparctic.wordpressDeployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wparctic.wordpressName" . }}-{{ .role }}
  labels:
{{ include "wparctic.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  replicas: {{ .replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: wordpress
      app.kubernetes.io/role: {{ .role }}
  template:
    metadata:
      labels:
{{ include "wparctic.labels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
        app.kubernetes.io/role: {{ .role }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
{{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: wordpress
          image: {{ include "wparctic.imageRef" .Values.wordpress.image }}
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: {{ include "wparctic.mariadbName" . | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.auth.username | quote }}
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.auth.database | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mariadb.existingSecret }}
                  key: {{ .Values.mariadb.auth.passwordSecretKey }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                // NGinx-specific: Force HTTPS detection from proxy headers (placed first)
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
                    $_SERVER['HTTPS'] = 'on';
                }
                $wparctic_public_host = '{{ .Values.ingress.host }}';
                $wparctic_admin_host = '{{ if and .Values.adminIngress.enabled .Values.adminIngress.host }}{{ .Values.adminIngress.host }}{{ else }}{{ .Values.ingress.host }}{{ end }}';
                {{- if eq .role "rw" }}
                // Keep admin/login cookies scoped to the admin host.
                define('WP_HOME', 'https://' . $wparctic_admin_host);
                define('WP_SITEURL', 'https://' . $wparctic_admin_host);
                {{- else }}
                define('WP_HOME', 'https://' . $wparctic_public_host);
                define('WP_SITEURL', 'https://' . $wparctic_public_host);
                {{- end }}
                define( 'FORCE_SSL_ADMIN', true );
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) $_SERVER['HTTPS'] = 'on';
                define('DISABLE_WP_CRON', true);
                define('WP_AUTO_UPDATE_CORE', 'minor');
                define('AUTOMATIC_UPDATER_DISABLED', false);

                if (!function_exists('add_filter') && defined('ABSPATH') && file_exists(ABSPATH . 'wp-includes/plugin.php')) {
                  require_once ABSPATH . 'wp-includes/plugin.php';
                }
                if (function_exists('add_filter')) {
                  add_filter('xmlrpc_enabled', '__return_false');
                  add_filter('site_transient_update_themes', static function ($transient) {
                    if (isset($transient->response['aurora'])) {
                      unset($transient->response['aurora']);
                    }
                    return $transient;
                  });
                  add_action('admin_init', static function() {
                    global $pagenow;
                    $action = isset($_GET['action']) ? $_GET['action'] : '';

                    if ($pagenow === 'update-core.php' && ($action === 'do-core-upgrade' || $action === 'do-core-reinstall')) {
                      wp_die('Manual core upgrades and reinstallations have been disabled. Security updates are applied automatically.');
                    }
                  });
                  add_filter('auto_core_update_send_email', '__return_false');

                  {{- if eq .role "rw" }}
                  // Keep post-login admin redirects on the admin host so auth cookies are honored.
                  add_filter('login_redirect', static function ($redirect_to, $requested_redirect_to, $user) use ($wparctic_public_host, $wparctic_admin_host) {
                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;

                    if (!is_wp_error($user) && !empty($user) && is_string($redirect_to) && str_contains($redirect_to, '/wp-admin')) {
                      return str_replace($public, $admin, $redirect_to);
                    }

                    if (!is_wp_error($user) && !empty($user) && is_string($requested_redirect_to) && str_contains($requested_redirect_to, '/wp-admin')) {
                      return str_replace($public, $admin, $requested_redirect_to);
                    }

                    return $redirect_to;
                  }, 10, 3);

                  // Show public URLs in admin copy/paste surfaces, except auth/admin paths.
                  $wparctic_to_public_url = static function ($url) use ($wparctic_public_host, $wparctic_admin_host) {
                    if (!is_string($url) || $url === '') {
                      return $url;
                    }

                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;
                    $urlOnAdmin = str_replace($public, $admin, $url);
                    $path = parse_url($urlOnAdmin, PHP_URL_PATH);
                    $normalizedPath = is_string($path) ? $path : '';

                    if ($normalizedPath === '/wp-login.php' || str_starts_with($normalizedPath, '/wp-admin')) {
                      return $urlOnAdmin;
                    }

                    return str_replace($admin, $public, $urlOnAdmin);
                  };

                  // Keep Gutenberg REST calls on the admin host to preserve nonce/cookie auth.
                  add_filter('rest_url', static function ($url) use ($wparctic_public_host, $wparctic_admin_host) {
                    if (!is_string($url) || $url === '') {
                      return $url;
                    }

                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;
                    return str_replace($public, $admin, $url);
                  }, 10, 1);

                  // Ensure preview buttons generated in the admin (e.g. "Preview Changes") point to the admin host so previews resolve to the RW pod.
                  // Run at high priority so it executes before other permalink rewrites.
                  add_filter('preview_post_link', static function ($link, $post) use ($wparctic_public_host, $wparctic_admin_host) {
                    if (!is_string($link) || $link === '') {
                      return $link;
                    }
                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;
                    return str_replace($public, $admin, $link);
                  }, 1, 2);

                  // REST responses for posts/pages (used by the block editor) sometimes include 'link' fields pointing to the public host.
                  // Ensure REST responses used in edit context or by users who can edit the post return admin-host links for drafts.
                  add_filter('rest_prepare_post', static function ($response, $post, $request) use ($wparctic_public_host, $wparctic_admin_host) {
                    $data = $response->get_data();
                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;

                    // Only modify when context is 'edit' or the current user can edit the post.
                    $context = $request instanceof WP_REST_Request ? $request->get_param('context') : null;
                    if ($context === 'edit' || current_user_can('edit_post', $post->ID)) {
                      if (isset($data['link'])) {
                        $data['link'] = str_replace($public, $admin, $data['link']);
                      }
                      if (isset($data['guid']) && is_array($data['guid']) && isset($data['guid']['rendered'])) {
                        $data['guid']['rendered'] = str_replace($public, $admin, $data['guid']['rendered']);
                      }
                      $response->set_data($data);
                    }
                    return $response;
                  }, 10, 3);

                  add_filter('rest_prepare_page', static function ($response, $post, $request) use ($wparctic_public_host, $wparctic_admin_host) {
                    $data = $response->get_data();
                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;

                    $context = $request instanceof WP_REST_Request ? $request->get_param('context') : null;
                    if ($context === 'edit' || current_user_can('edit_post', $post->ID)) {
                      if (isset($data['link'])) {
                        $data['link'] = str_replace($public, $admin, $data['link']);
                      }
                      if (isset($data['guid']) && is_array($data['guid']) && isset($data['guid']['rendered'])) {
                        $data['guid']['rendered'] = str_replace($public, $admin, $data['guid']['rendered']);
                      }
                      $response->set_data($data);
                    }
                    return $response;
                  }, 10, 3);

                  // Only force admin-host permalinks for admin AJAX flows or non-published posts (drafts/revisions).
                  // This keeps the Permalink display for published posts pointing to the public host.
                  add_filter('post_link', static function ($url, $post = null, $leavename = '') use ($wparctic_to_public_url, $wparctic_public_host, $wparctic_admin_host) {
                    if (is_admin()) {
                      $public = 'https://' . $wparctic_public_host;
                      $admin = 'https://' . $wparctic_admin_host;

                      // Admin AJAX (editor/editor autosaves) should use admin-host links so previews/auth work.
                      if (defined('DOING_AJAX') && DOING_AJAX) {
                        return str_replace($public, $admin, $url);
                      }

                      // If we have a post object and it's not published, keep the admin host (drafts, pending, revisions).
                      if (is_object($post)) {
                        $status = isset($post->post_status) ? $post->post_status : '';
                        if ($status !== 'publish') {
                          return str_replace($public, $admin, $url);
                        }
                      }
                    }
                    return $wparctic_to_public_url($url);
                  }, 10, 3);

                  add_filter('page_link', static function ($url, $post = null) use ($wparctic_to_public_url, $wparctic_public_host, $wparctic_admin_host) {
                    if (is_admin()) {
                      $public = 'https://' . $wparctic_public_host;
                      $admin = 'https://' . $wparctic_admin_host;
                      if (defined('DOING_AJAX') && DOING_AJAX) {
                        return str_replace($public, $admin, $url);
                      }
                      if (is_object($post)) {
                        $status = isset($post->post_status) ? $post->post_status : '';
                        if ($status !== 'publish') {
                          return str_replace($public, $admin, $url);
                        }
                      }
                    }
                    return $wparctic_to_public_url($url);
                  }, 10, 2);

                  add_filter('post_type_link', static function ($url, $post = null, $leavename = '') use ($wparctic_to_public_url, $wparctic_public_host, $wparctic_admin_host) {
                    if (is_admin()) {
                      $public = 'https://' . $wparctic_public_host;
                      $admin = 'https://' . $wparctic_admin_host;
                      if (defined('DOING_AJAX') && DOING_AJAX) {
                        return str_replace($public, $admin, $url);
                      }
                      if (is_object($post)) {
                        $status = isset($post->post_status) ? $post->post_status : '';
                        if ($status !== 'publish') {
                          return str_replace($public, $admin, $url);
                        }
                      }
                    }
                    return $wparctic_to_public_url($url);
                  }, 10, 3);

                  add_filter('attachment_link', static function ($url) use ($wparctic_to_public_url) {
                    return $wparctic_to_public_url($url);
                  }, 10, 1);
                  add_filter('wp_get_attachment_url', static function ($url) use ($wparctic_to_public_url) {
                    return $wparctic_to_public_url($url);
                  }, 10, 1);

                  // Classic editor sample permalink anchors must point to the public host.
                  // The preview button itself is a separate WordPress control and already uses the admin-host preview URL via preview_post_link.
                  add_filter('get_sample_permalink_html', static function ($html) use ($wparctic_public_host, $wparctic_admin_host) {
                    if (!is_string($html) || $html === '') {
                      return $html;
                    }

                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;

                    return preg_replace_callback('/<a\s+([^>]*?)href=("|\')(https?:\/\/[^"\']*)(\2)([^>]*)>/i', function ($m) use ($public, $admin) {
                      $before = $m[1];
                      $quote = $m[2];
                      $after = $m[5];
                      $href = str_replace($admin, $public, $m[3]);
                      return '<a ' . $before . ' href=' . $quote . $href . $quote . $after . '>';
                    }, $html, 1);
                  }, 10, 1);

                  // Ensure media links copied from admin resolve to the public host.
                  add_filter('upload_dir', static function ($dirs) use ($wparctic_public_host, $wparctic_admin_host) {
                    $public = 'https://' . $wparctic_public_host;
                    $admin = 'https://' . $wparctic_admin_host;
                    if (!empty($dirs['baseurl'])) {
                      $dirs['baseurl'] = str_replace($admin, $public, $dirs['baseurl']);
                    }
                    if (!empty($dirs['url'])) {
                      $dirs['url'] = str_replace($admin, $public, $dirs['url']);
                    }
                    return $dirs;
                  });
                  {{- end }}
                }
                define('FS_METHOD', 'direct');
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          {{- with .Values.wordpress.postStart }}
          lifecycle:
            postStart:
          {{ toYaml . | nindent 14 }}
          {{- end }}
          resources:
            {{ toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html/wp-content
              subPath: {{ .Values.wordpress.persistence.subPath }}
            {{- if eq .role "rw" }}
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/uploads.ini
              subPath: uploads.ini
            {{- end }}
            {{- if .Values.robotsTxt.enabled }}
            - name: robots-txt
              mountPath: /var/www/html/robots.txt
              subPath: {{ .Values.robotsTxt.key }}
            {{- end }}
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ .Values.wordpress.persistence.existingClaim }}
        {{- if eq .role "rw" }}
        - name: php-config
          configMap:
            name: wp-php-overrides
        {{- end }}
        {{- if .Values.robotsTxt.enabled }}
        - name: robots-txt
          configMap:
            name: {{ .Values.robotsTxt.existingConfigMap }}
        {{- end }}
{{- end -}}
