{{- if .Values.adminIngress.ipAllowList }}
##
## This file contains "ipAllowList" middleware definitions for Traefik.
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-ip-allowlist-admin
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
    {{- range .Values.adminIngress.ipAllowList }}
      - {{ . }}
    {{- end }}
{{- end }}
