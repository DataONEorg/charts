{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "wparctic.wordpressName" . }}
  labels:
    {{- include "wparctic.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
  annotations:
    {{- if .Values.ingress.tlsWwwPrefix }}
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    {{- end }}
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if .Values.adminIngress.enabled }}
          - path: {{ .Values.adminIngress.path }}
            pathType: {{ .Values.adminIngress.pathType }}
            backend:
              service:
                name: {{ include "wparctic.wordpressName" . }}-rw
                port:
                  name: http
          - path: /wp-json
            pathType: Prefix
            backend:
              service:
                name: {{ include "wparctic.wordpressName" . }}-rw
                port:
                  name: http
          {{- range .Values.adminIngress.extraPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "wparctic.wordpressName" $ }}-rw
                port:
                  name: http
          {{- end }}
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "wparctic.wordpressName" . }}
                port:
                  name: http
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
        {{- if .Values.ingress.tlsWwwPrefix }}
        - www.{{ .Values.ingress.host }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
