{{/*
Creates the Deployment for the single read/write (rw) WordPress pod.
Allows automatic security/minor updates and keeps major upgrades out of the admin UI.
*/}}
{{- include "wparctic.wordpressDeployment" (dict
  "Values" .Values
  "Release" .Release
  "Chart" .Chart
  "replicas" 1
  "role" "rw"
) }}
