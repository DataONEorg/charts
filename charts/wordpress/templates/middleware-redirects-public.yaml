##
## This file contains "redirect" middleware definitions for Traefik.
##
## IMPORTANT: ADD THE NAMES OF ANY NEW MIDDLEWARES TO helm/templates/middleware-chain.yaml, OR THEY
## WON'T BE LOADED!
##
{{- if .Values.ingress.tlsWwwPrefix }}
---
##
## Redirect www requests to non-www address.
## Ignored unless .Values.ingress.tlsWwwPrefix: true
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-www-redirect
  namespace: {{ .Release.Namespace }}
spec:
  redirectRegex:
    regex: "^https?://www[.](.*)"
    replacement: "https://${1}"
    permanent: true
{{- end }}

{{- range .Values.ingress.rewriteRules }}
---
##
## Pull any custom redirects from .Values.ingress.rewriteRules
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $.Release.Name }}-{{ .name }}-public
  namespace: {{ $.Release.Namespace }}
spec:
  redirectRegex:
    regex: {{ .regex | quote }}
    replacement: {{ .replacement | quote }}
    permanent: {{ default "false" .permanent }}
{{- end }}
