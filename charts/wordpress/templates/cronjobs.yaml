apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "wparctic.wordpressName" . }}-wp-cron
spec:
  schedule: {{ .Values.wordpress.updateSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ## Don't retry failures; the next scheduled run retries naturally, and in-job retries would
      ## block later runs (concurrencyPolicy: Forbid), delaying time-sensitive WP-Cron events
      backoffLimit: 0
      template:
        spec:
          ## Needs permission to 'get' and 'exec' into pods. By convention, we use the namespace
          ## name as the service account name
          serviceAccountName: {{ .Release.Namespace }}
          restartPolicy: Never
          containers:
            - name: kubectl-updater
              image: eclipsefdn/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  RC=0

                  ## Run the WP-Cron event queue (scheduled posts, cleanups, plugin jobs), since
                  ## DISABLE_WP_CRON is set. Runs on ONE pod, since events are shared via the DB &
                  ## PVC. Prefer an ro pod so generated links use the public host; with
                  ## replicaCount 1 there are no ro pods, and admin host == public host anyway.
                  echo "=== Running WP-Cron Events ==="
                  CRON_POD=$(kubectl get pods --field-selector=status.phase=Running \
                    -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=wordpress,app.kubernetes.io/role={{ if gt (int .Values.replicaCount) 1 }}ro{{ else }}rw{{ end }} \
                    -o jsonpath='{.items[0].metadata.name}')
                  if [ -n "$CRON_POD" ]; then
                    echo "Running WP-Cron events on pod: $CRON_POD"
                    kubectl exec $CRON_POD -- php /var/www/html/wp-cron.php || RC=1
                  else
                    echo "ERROR: no running pod found for WP-Cron events"
                    RC=1
                  fi

                  ## Run updates hourly, in the first run of each hour. Assumes updateSchedule
                  ## runs every 10 mins. Runs on EVERY pod, since WP core is not on the shared PVC
                  if [ "$(date +%M)" -lt 10 ]; then
                    echo "=== Starting Security Auto-Updates ==="
                    PODS=$(kubectl get pods -l app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=wordpress -o jsonpath='{.items[*].metadata.name}')

                    for POD in $PODS; do
                      echo "Checking and updating pod: $POD"
                      kubectl exec $POD -- php -r '
                        require "/var/www/html/wp-load.php";
                        require_once ABSPATH . "wp-admin/includes/file.php";
                        require_once ABSPATH . "wp-admin/includes/misc.php";
                        require_once ABSPATH . "wp-admin/includes/update.php";
                        require_once ABSPATH . "wp-admin/includes/class-wp-upgrader.php";
                        require_once ABSPATH . "wp-admin/includes/class-wp-automatic-updater.php";

                        delete_option("auto_updater.lock");
                        wp_version_check();
                        $updater = new WP_Automatic_Updater();
                        $updater->run();
                      ' || RC=1
                    done
                    echo "=== Auto-Updates Complete ==="
                  fi
                  exit $RC
