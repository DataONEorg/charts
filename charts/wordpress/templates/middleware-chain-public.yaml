##
## Only one middleware can be added to the ingress annotations. This middleware "chain" definition
## chains together all the other Traefik Middlewares, so only this one needs to be referenced
## in the ingress annotations. THIS CHAIN IS FOR THE PUBLIC INGRESS
##
## * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
## IMPORTANT: ADD THE NAMES OF ANY NEW MIDDLEWARES TO THIS TEMPLATE, OR THEY WON'T BE LOADED!
## * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * * *
##
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-middleware-chain-public
  namespace: {{ .Release.Namespace }}
spec:
  chain:
    middlewares:
      - name: {{ .Release.Name }}-security-headers-public
      {{- if .Values.ingress.tlsWwwPrefix }}
      - name: {{ .Release.Name }}-www-redirect
      {{- end }}
      {{- range .Values.ingress.rewriteRules }}
      - name: {{ $.Release.Name }}-{{ .name }}-public
      {{- end }}
