##
## REQUIRED PLACEHOLDER: Traefik TLSOption for verifying mutual TLS (mTLS) client cert
##
## Not actually used by this chart, but REQUIRED when multiple ingress definitions are
## co-deployed with metacat, otherwise Traefik reverts to no client certificate validation,
## breaking mutual TLS (mTLS) for metacat.
## See https://doc.traefik.io/traefik/v2.11/https/tls/#conflicting-tls-options
## Harmless if mTLS is not used, since TLSOption clientAuthType is 'VerifyClientCertIfGiven'
## (so ignores if no cert)
##
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ .Release.Name }}-mtls-policy
  namespace: {{ .Release.Namespace }}
spec:
  clientAuth:
    clientAuthType: VerifyClientCertIfGiven
    secretNames:
      - {{ .Values.ingress.d1CaCertSecretName }}
