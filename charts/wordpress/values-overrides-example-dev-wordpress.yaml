replicaCount: 2
## if replicaCount < 2, set podDisruptionBudget.enabled to false, to avoid eviction issues
## Otherwise, set to true
podDisruptionBudget:
  enabled: true

wordpress:
  image:
    ## DEFINE ONLY MAJOR-VERSION TAGS, to allow auto upgrade on pod redeploy
    ## Example: tag: "7-php8.5-apache" (*NOT* "7.0-php8.5-apache" or "7.0.4-php8.5-apache")
    ## Available image tags: https://hub.docker.com/_/wordpress?tab=tags
    ## release notes: https://wordpress.org/news/category/releases/
    tag: "7-php8.5-apache"
  existingSecret: wparctic-wordpress
  persistence:
    existingClaim: wparctic-wordpress-0
  resources:
    requests:
      cpu: "250m"
      memory: 500Mi
    limits:
      cpu: "500m"
      memory: 1Gi

mariadb:
  image:
    ## Available image tags: https://hub.docker.com/_/mariadb?tab=tags
    ## release notes: https://mariadb.com/docs/release-notes/community-server
    ## upgrade notes (major/minor specifics):
    ## https://mariadb.com/docs/server/server-management/install-and-upgrade-mariadb/upgrading/upgrading-from-to-specific-versions
    tag: "12.3"
  existingSecret: wparctic-mariadb
  persistence:
    existingClaim: wparctic-wordpress-mariadbd-0
    subPath: data
  resources:
    requests:
      cpu: "250m"
      memory: 500Mi
    limits:
      cpu: "500m"
      memory: 1Gi

ingress:
  ## @param ingress.host The domain name of the main public WordPress site (e.g. "arcticdata.io")
  ##
  host: wp-dev.test.dataone.org
  tlsSecretName: ingress-wp-tls-cert
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

adminIngress:
  ## @param adminIngress.host The domain name of the WordPress Admin site (eg: "wp-admin.arcticdata.io")
  ## IMPORTANT:
  ## If you are running only ONE WP pod (replicaCount: 1) this must be the same as ingress.host
  ## If you are running 2 OR MORE WP pods (replicaCount: 2 or more), use a DIFFERENT domain to avoid
  ## issues when editing Themes in Preview Mode
  ##
  host: wp-dev-admin.test.dataone.org
