# Creates a persistent volume claim for use by mariadb (subchart of wordpress)
#
# This should be done only one time, separately from the helm install/upgrade cycle
#
# NOTE: ensure that a PersistentVolume has already been created before creating
#       the PersistentVolumeClaim!
#
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wparctic-wordpress-mariadbd-0
  namespace: brooke
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  volumeName: cephfs-wpbrooke-wordpress-mariadbdata
  resources:
    requests:
      storage: 10Gi
  storageClassName: csi-cephfs-sc
