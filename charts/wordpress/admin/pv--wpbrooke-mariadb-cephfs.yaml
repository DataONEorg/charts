apiVersion: v1
kind: PersistentVolume
metadata:
  # See https://github.com/DataONEorg/k8s-cluster/blob/main/storage/storage.md#dataone-volume-naming-conventions
  # cephs-{release}-{function}-{instance}, where {release} usually = {namespace}
  name: &pv-name cephfs-wpbrooke-wordpress-mariadbdata
  labels:
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 10Gi
  csi:
    driver: cephfs.csi.ceph.com
    nodeStageSecretRef:
      # node stage secret name
      name: csi-cephfs-test-data-tdg-subvol
      # node stage secret namespace where above secret is created
      namespace: ceph-csi-cephfs
    volumeAttributes:
      clusterID: 8aa4d4a0-a209-11ea-baf5-ffc787bfc812
      fsName: cephfs
      rootPath: /volumes/tdg-subvol-group/tdg-subvol/131b18ad-e09d-4234-8bea-7c60ffa5621c/repos/dev/wordpress/mariadb
      staticVolume: "true"
    volumeHandle: *pv-name
  persistentVolumeReclaimPolicy: Retain
  storageClassName: csi-cephfs-sc
  volumeMode: Filesystem
