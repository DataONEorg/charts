replicaCount: 3
## if replicaCount < 2, set podDisruptionBudget.enabled to false, to avoid eviction issues
## Otherwise, set to true
podDisruptionBudget:
  enabled: true
  minAvailable: 1

wordpress:
  image:
    repository: docker.io/library/wordpress
    tag: "OVERRIDE-BY-USER-REQUIRED"
    digest: ""
    pullPolicy: Always
  existingSecret: wparctic-wordpress
  persistence:
    existingClaim: wparctic-wordpress-0
    subPath: wp-content
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

  ## Overriding the default 2MB PHP upload limit
  uploadLimits:
    ## PHP upload_max_filesize setting. This is the maximum size of an uploaded file.
    ##
    maxFilesize: 100M

    ## PHP post_max_size setting. Must be larger than upload_max_filesize to allow for the request
    ## envelope. NOTE that the ingress must also be configured to allow payloads at least this large
    ## (See adminIngress.annotations.'nginx.ingress.kubernetes.io/proxy-body-size')
    ##
    postMaxSize: 105M

    ## PHP memory_limit setting. Typical baseline WordPress installation generally needs ~128 MB RAM
    ## just to idle and process standard web requests, on top of to the upload limits set above.
    ## Increase if seeing OOM errors
    ##
    memoryLimit: 256M

  service:
    port: 80
  ## postStart command to remove:
  ## 1. the default Akismet and Hello Dolly plugins and default themes that come with the official
  ##    WordPress image, since they are copied from the template on every new helm deployment
  ## 2. xmlrpc.php, to disable this potential attack vector.
  ##
  postStart:
    exec:
      command:
        - /bin/sh
        - -ec
        - |-
          # Entry-point copy and postStart have no strict ordering; keep pruning for a short window.
          (
            for i in $(seq 1 30); do
              rm -rf /var/www/html/wp-content/plugins/akismet \
                /var/www/html/wp-content/plugins/hello.php \
                /var/www/html/wp-content/themes/twentytwenty* \
                /var/www/html/xmlrpc.php || true
              sleep 1
            done
          ) &
          exit 0

mariadb:
  autoUpgrade: true
  image:
    repository: docker.io/library/mariadb
    tag: "OVERRIDE-BY-USER-REQUIRED"
    digest: ""
    pullPolicy: IfNotPresent
  existingSecret: wparctic-mariadb
  auth:
    database: arcticadata_wp
    username: arcticadata
    passwordSecretKey: mariadb-password
    rootPasswordSecretKey: mariadb-root-password
  persistence:
    existingClaim: wparctic-wordpress-mariadbd-0
    subPath: data
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

robotsTxt:
  enabled: true
  existingConfigMap: wparctic-wordpress-robots-txt
  key: robots.txt

ingress:
  enabled: true
  className: traefik
  ## @param ingress.host The domain name of the main public WordPress site (e.g. "arcticdata.io")
  ##
  host: localhost
  ## @param ingress.tlsSecretName secret for main public site. Matches ADC site TLS secret name
  ##
  tlsSecretName: ingress-tls-cert
  ## Automatically add support for mapping www.example.com to example.com (adds entries in ingress
  ## annotations and tls block)
  ##
  tlsWwwPrefix: true
  pathType: Prefix
  path: /

  ## @param ingress.rewriteRules Traefik rewrite rules that will be added to the middleware chain
  ##
  ## This should be a **YAML LIST** of rules, each with a name, regex, replacement, and optional
  ## permanent flag (which defaults to "false"). These rules will be added as traefik Middleware
  ## definitions in middleware-redirects-public.yaml
  ##
  ## Example syntax:
  ##     rewriteRules:
  ##       - name: sitemap-redirect
  ##         regex: "^https?://([^/]+)/(sitemap.+)"
  ##         replacement: "https://${1}/metacat/sitemaps/${2}"
  ##         permanent: false  # optional; defaults to "false"
  ##       - name: robots-redirect
  ##         regex: "^https?://([^/]+)/robots.txt"
  ##         replacement: "https://${1}/metacat/robots.txt"
  ##
  ## Traefik supports regex capture groups using the syntax ( ), which can be back-referenced using
  ## the syntax ${1}, ${2}, etc. However, no server variables are available (like nginx's ${host},
  ## ${request_uri}, etc.)
  ##
  rewriteRules:
    - name: sitemap-redirect
      regex: "^https?://([^/]+)/(sitemap.+)"
      replacement: "https://${1}/metacat/sitemaps/${2}"
    - name: old-blog-1
      regex: "^https?://[^/]+/(dataset-highlight-subsistence-harvests-in-alaskan-communities-along-the-bering-sea-with-dr-james-fall)/?"
      replacement: "https://arcticdata.io/blog/2018/06/${1}"
      permanent: true
    - name: old-blog-2
      regex: "^https?://[^/]+/(dataset-highlight-phenological-mismatch-in-the-arctic-with-dr-kathy-kelsey)/?"
      replacement: "https://arcticdata.io/blog/2018/08/${1}"
      permanent: true
    - name: old-blog-3
      regex: "^https?://[^/]+/(dataset-highlight-learning-from-the-hunters-in-savoonga-with-dr-henry-huntington)/?"
      replacement: "https://arcticdata.io/blog/2019/05/${1}"
      permanent: true
    - name: old-blog-4
      regex: "^https?://[^/]+/(dataset-highlight-investigating-rotten-ice-with-dr-karen-junge)/?"
      replacement: "https://arcticdata.io/blog/2018/07/${1}"
      permanent: true
    - name: old-blog-5
      regex: "^https?://[^/]+/(dataset-highlight-exploring-the-energy-clouds-atmosphere-and-precipitation-in-summit-greenland-through-icecaps-with-dr-matthew-shupe)/?"
      replacement: "https://arcticdata.io/blog/2018/10/${1}"
      permanent: true
    - name: old-blog-6
      regex: "^https?://[^/]+/(dataset-highlight-dissolved-organic-carbon-with-dr-rose-cory)/?"
      replacement: "https://arcticdata.io/blog/2018/04/${1}"
      permanent: true
    - name: old-blog-7
      regex: "^https?://[^/]+/(dataset-highlight-discovering-the-connections-between-mountain-glaciers-and-arctic-groundwater-with-dr-anna-liljedahl)/?"
      replacement: "https://arcticdata.io/blog/2018/10/${1}"
      permanent: true
    - name: old-blog-8
      regex: "^https?://[^/]+/(dataset-highlight-data-provenance-and-arctic-soil-bacteria)/?"
      replacement: "https://arcticdata.io/blog/2018/03/${1}"
      permanent: true

adminIngress:
  enabled: true
  className: traefik
  ## @param adminIngress.host The domain name of the WordPress Admin site (eg: "wp-admin.arcticdata.io")
  ## IMPORTANT:
  ## If you are running only ONE WP pod (replicaCount: 1) this must be the same as ingress.host
  ## If you are running 2 OR MORE WP pods (replicaCount: 2 or more), use a DIFFERENT domain to avoid
  ## issues when editing Themes in Preview Mode
  ##
  host: localhost
  ## @param adminIngress.tlsSecretName secret for admin url. DIFFERENT from ADC site TLS secret name
  ## since hostname is unique and not shared by other ingresses
  ##
  tlsSecretName: ingress-wpadmin-tls-cert
  pathType: Prefix
  path: /wp-admin

  ## @param adminIngress.ipAllowList Access limited to these IP addresses/ranges. Empty = no restrictions
  ## For more options on filtering, see the traefik docs for ipAllowList Middleware:
  ## https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/ipallowlist/
  ##
  ## Example:
  ## ipAllowList:
  ##  - 128.111.61.0/24
  ##  - 128.111.64.0/22
  ##  - 128.111.85.0/24
  ##
  ipAllowList:
    - 128.111.61.0/24
    - 128.111.64.0/22
    - 128.111.85.0/24
    - 128.111.180.0/22
    - 128.111.188.0/22
    - 128.111.196.0/23
    - 207.71.230.208/29

  ## @param adminIngress.rewriteRules Traefik rewrite rules that will be added to the middleware
  ## chain
  ##
  ## This should be a **YAML LIST** of rules, each with a name, regex, replacement, and optional
  ## permanent flag (which defaults to "false"). These rules will be added as traefik Middleware
  ## definitions in middleware-redirects-public.yaml
  ##
  ## Example syntax:
  ##     rewriteRules:
  ##       - name: sitemap-redirect
  ##         regex: "^https?://([^/]+)/(sitemap.+)"
  ##         replacement: "https://${1}/metacat/sitemaps/${2}"
  ##         permanent: false  # optional; defaults to "false"
  ##       - name: robots-redirect
  ##         regex: "^https?://([^/]+)/robots.txt"
  ##         replacement: "https://${1}/metacat/robots.txt"
  ##
  ## Traefik supports regex capture groups using the syntax ( ), which can be back-referenced using
  ## the syntax ${1}, ${2}, etc. However, no server variables are available (like nginx's ${host},
  ## ${request_uri}, etc.)
  ##
  rewriteRules:
    - name: trailing-slash
      regex: "^https?://([^/]+)/wp-admin$"
      replacement: "https://${1}/wp-admin/"

  annotations:
    ## OK to auto-generate a cert for admin url (since hostname is unique and not shared by other
    ## ingresses), PROVIDED WE USE A tlsSecretName THAT IS DIFFERENT FROM THE REGULAR ADC TLS SECRET
    ##
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

  extraPaths:
    - path: /wp-login.php
      pathType: Exact
    - path: /wp-admin/admin-ajax.php
      pathType: Exact

podSecurityContext: {}
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
