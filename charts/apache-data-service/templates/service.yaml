apiVersion: v1
kind: Service
metadata:
  name: {{ include "apache-datasvc.fullname" . }}
  labels:
    {{- include "apache-datasvc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "apache-datasvc.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
