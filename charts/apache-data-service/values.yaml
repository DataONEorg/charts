## override values.yaml for bitnami nginx instance to serve static files from knb.ecoinformatics.org/data
##
## As prod-knb:
##  $  helm upgrade --install datasvcknb -n knb bitnami/apache
##                  -f values-prod-cluster-apache-datasvc-knb.yaml --version [VERSION] \
##                  --debug
##

## Available image versions: https://hub.docker.com/hardened-images/catalog/dhi/httpd/images
##
image:
  repository: dhi.io/httpd
  tag: "OVERRIDE-BY-USER-REQUIRED"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: dhi-pull-secret

podSecurityContext:
  fsGroupChangePolicy: OnRootMismatch

securityContext: {}

## @param resources Resource requests and limits for the Apache container. Adjust as needed based on
## expected load and performance requirements. Note that these are just example values and will
## need to be tuned for your specific use case.
##
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 8Gi

extraVolumes:
  - name: static-files-vol
    persistentVolumeClaim:
      claimName: REQUIRED-PVC-NAME-HERE
      readOnly: true

extraVolumeMounts:
  - name: static-files-vol
    mountPath: /var/files
    subPath: ""

## @param ingress.iconFilePath filesystem path to default icons shipped with Apache image.
## Absolute file path: use leading slash but NO TRAILING SLASH!
## e.g:
## iconFilePath: /usr/local/apache2/icons
##
## (Also see 'ingress.iconPath')
##
iconFilePath: /usr/local/apache2/icons

## @param routes An array with additional arbitrary URI paths for static files to be served
## Don't define backend; this is auto-populated to point to the Apache service
## routes:
##  - ingressPath:      Ingress URI path: use leading slash but NO TRAILING SLASH!
##    ingressPathType:  Ingress path type: Prefix or Exact
##    filePath:         (optional) Absolute filesystem path: use leading slash but NO TRAILING
##                      SLASH! If omitted, no Apache vhosts entry will be created (see below); only
##                      an ingress path will be created.
##
## In addition to configuring ingress paths, these are also used to create entries in the
## Apache vhosts config, like this:
##       Alias "{{ $p.ingressPath }}/" "{{ $p.filePath }}/"
##       <Directory "{{ $p.filePath }}">
##           Options +FollowSymlinks +Indexes
##           Require all granted
##       </Directory>
##
## If you need to customize this, you can provide your own Apache vhosts config; see vhostsConfigMap
##
## Example for ADC:
## routes:
##  - ingressPath: /data
##    ingressPathType: Prefix
##    filePath: /var/data
##  - ingressPath: /fever/data
##    ingressPathType: Prefix
##  - ingressPath: /research.gov
##    ingressPathType: Prefix
##
routes: []

## @param extraModules Additional Apache modules to be enabled. Must include 'LoadModule' directives
## Example for ADC:
## extraModules: |-
##   LoadModule proxy_module modules/mod_proxy.so
##   LoadModule proxy_http_module modules/mod_proxy_http.so
##   LoadModule proxy_connect_module modules/mod_proxy_connect.so
##   LoadModule ssl_module modules/mod_ssl.so
##
extraModules: ""

## @param extraVhostConfig Additional configuration to be added to the Apache vhosts config template
## Example for ADC:
## extraVhostConfig: |-
##   ProxyPass        "/research.gov/awardapi-service/v1/awards.json" "https://www.research.gov/awardapi-service/v1/awards.json"
##   ProxyPassReverse "/research.gov/awardapi-service/v1/awards.json" "https://www.research.gov/awardapi-service/v1/awards.json"
##   SSLProxyEngine   on
##
extraVhostConfig: ""

## @param customVhostsConfig Use a user-provided ConfigMap to override chart's virtual hosts content
## @param customVhostsConfig.enabled If false, defaults to using configmap-vhost.yaml in this chart,
##                                   populated from values in 'routes'
## @param customVhostsConfig.configMapName Name of config map used to override virtual hosts file
##
customVhostsConfig:
  enabled: false
  configMapName: ""

ingress:
  ## @param ingress.enabled Set to true to enable ingress record generation
  ##
  enabled: true

  ## @param ingress.ingressClassName Set the ingerssClassName on the ingress record for k8s 1.18+
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  ingressClassName: nginx

  ## @param ingress.hostname Default host for the ingress resource (REQUIRED)
  ##
  hostname: localhost

  ## @param ingress.annotations Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## For a full list of possible ingress annotations, please see
  ## ref: https://github.com/kubernetes/ingress-nginx/blob/main/docs/user-guide/nginx-configuration/annotations.md
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ##
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Cors Setup

      set $cors 'true';

      if ($request_method = 'OPTIONS') {
        set $cors ${cors}options;
      }

      if ($cors = "true") {
        more_set_headers 'Access-Control-Allow-Origin: $http_origin';
        more_set_headers 'Access-Control-Allow-Credentials: true';
        more_set_headers 'Access-Control-Allow-Methods: POST, PUT, GET, OPTIONS';
        more_set_headers 'Access-Control-Allow-Headers: DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';

        more_set_headers 'Access-Control-Max-Age: 1728000';
      }

      if ($cors = "trueoptions") {
        more_set_headers 'Access-Control-Allow-Origin: $http_origin';
        more_set_headers 'Access-Control-Allow-Credentials: true';
        more_set_headers 'Access-Control-Allow-Methods: POST, PUT, GET, OPTIONS';
        more_set_headers 'Access-Control-Allow-Headers: DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';

        more_set_headers 'Access-Control-Max-Age: 1728000';
        more_set_headers 'Content-Type: text/plain charset=UTF-8';
        more_set_headers 'Content-Length: 0';
        return 204;
      }

  tlsWwwPrefix: true

  tls: []
